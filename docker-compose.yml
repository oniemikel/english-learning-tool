services:
  mysql:
    image: mysql:8.4
    container_name: english-db

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: english_learning
      MYSQL_USER: app
      MYSQL_PASSWORD: password

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: